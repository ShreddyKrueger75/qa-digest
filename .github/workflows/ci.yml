name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        exclude:
          # ubuntu-latest (26.04) has no 3.9 build; 3.9 matters on macOS,
          # which is where the skill actually runs.
          - os: ubuntu-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg (end-to-end test)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; fi

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest Pillow numpy

      - name: Run local CI runner
        run: bash scripts/ci.sh
